# Uma linha, um evento. Aqui isso é verdade e é a quebra padrão que acerta —
# diferente do lab da fase 2, onde o registro tem doze linhas.
[bulk:line]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2}T)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3Q%z
MAX_TIMESTAMP_LOOKAHEAD = 32
