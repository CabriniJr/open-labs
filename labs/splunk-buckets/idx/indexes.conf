# O índice do lab, e os quatro limites que decidem até onde dá para pesquisar.
#
# Nenhum deles é "retenção". A retenção é o que sobra da conta entre eles e o
# volume diário — e é por isso que ela não aparece escrita em lugar nenhum.
#
# Fontes:
#   https://help.splunk.com/en/splunk-enterprise/administer/manage-indexers-and-indexer-clusters/10.6/back-up-and-archive-your-indexes/set-a-retirement-and-archiving-policy
#   https://help.splunk.com/en/data-management/manage-splunk-enterprise-indexers/9.3/manage-index-storage/configure-index-storage
[openlabs]
# Os três caminhos. `thawedPath` é obrigatório e é onde balde RESTAURADO é
# colocado — ele não salva nada por existir, e é a confusão que o exercício
# sobre o congelamento explora.
homePath   = $SPLUNK_DB/openlabs/db
coldPath   = $SPLUNK_DB/openlabs/colddb
thawedPath = $SPLUNK_DB/openlabs/thaweddb

# Quando um balde quente fecha. Pequeno de propósito: o default é o valor
# especial `auto`, que são 750 MB, e com ele nada rolaria em minutos.
maxDataSize = 50

# Quantos baldes mornos cabem antes de o mais velho esfriar. Limite de
# CONTAGEM, e não de tamanho — o default são 300.
maxWarmDBCount = 6

# <handbook:trecho id="o-limite-que-decide">
# O tamanho do índice INTEIRO. É este que, na prática, decide a retenção de
# quase toda instalação: 500 000 MB é o default, e o dado congela quando
# qualquer um dos dois limites chega primeiro.
# <handbook:lacuna>
maxTotalDataSizeMB = 400
# </handbook:lacuna>
# </handbook:trecho>

# <handbook:trecho id="o-tempo-que-eu-quis">
# A idade máxima de um balde. O default são 188 697 600 segundos, aproximadamente
# seis anos — e a idade é por BALDE: todo evento dele tem de ser mais velho que
# isto para ele rolar.
# <handbook:lacuna>
frozenTimePeriodInSecs = 2592000
# </handbook:lacuna>
# </handbook:trecho>

# <handbook:trecho id="o-que-acontece-com-o-congelado">
# Congelar é REMOVER do índice. Sem esta linha, o balde é apagado — e apagar é
# o comportamento normal, então não há aviso nenhum.
# <handbook:lacuna>
coldToFrozenDir = /opt/splunk/frozen
# </handbook:lacuna>
# </handbook:trecho>
