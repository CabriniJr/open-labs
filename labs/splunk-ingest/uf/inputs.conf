# O que o forwarder universal lê, e com que etiqueta.
#
# Esta é a fase de **input**, e é a única que esta máquina executa: ela abre o
# arquivo, corta o fluxo em blocos de 64 KiB e anota cada bloco com host,
# source e sourcetype. Nada aqui dentro é evento ainda.
#
# O ponto a ler: `sourcetype`. Ele parece etiqueta de busca e não é — é a alça
# de que toda regra de parsing pende. O `idx/props.conf` tem uma estrofe
# `[app:json]`, e ela só se aplica ao dado que chegou com ESTA etiqueta. Errar
# aqui é entregar o dado certo para o conjunto de regras errado, e nenhum
# contador vai dizer que algo deu errado.
[monitor:///var/log/app/app.log]
index = main
# <handbook:trecho id="a-etiqueta-da-fonte">
# <handbook:lacuna>
sourcetype = app:json
# </handbook:lacuna>
# </handbook:trecho>
