# O `props.conf` do forwarder universal — e ele existe para mostrar o que
# **pode** morar aqui.
#
# `LINE_BREAKER` não pode: ele pertence à fase de parsing, que esta máquina não
# executa. Um arquivo com ele aqui sobe sem reclamar e não faz nada.
#
# `EVENT_BREAKER` pode, e é só aqui: a documentação diz que ele é válido
# somente em instâncias de forwarder universal. Ele não quebra evento para
# indexar — ele corta os pedaços que saem pela rede em fronteiras de evento,
# para que o balanceamento automático troque de indexador no fim de um evento e
# não no meio dele. Com um indexador só, como neste compose, ele não muda nada;
# está aqui porque é o arquivo em que a pergunta "o que vale nesta máquina?"
# tem resposta diferente da do indexador.
#
# Fontes:
#   https://docs.splunk.com/Documentation/Splunk/9.3.1/Forwarding/Typesofforwarders
#   https://splunk.my.site.com/customer/s/article/EVENT-BREAKER
[app:json]
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2}T)
