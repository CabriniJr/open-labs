# Para onde o forwarder universal manda, e o que ele considera "entregue".
#
# O ponto a ler: `useACK`. Sem ele, "enviado" quer dizer que o socket aceitou
# os bytes — e o bloco que estava em trânsito quando o indexador caiu não
# existe mais em lugar nenhum, porque o forwarder já avançou o ponteiro do
# arquivo. Com ele, o forwarder guarda o bloco até o indexador confirmar que
# recebeu, e reenvia o que não for confirmado.
#
# Ele é `false` por padrão, e isso é a decisão mais consequente deste arquivo.
[tcpout]
defaultGroup = openlabs

[tcpout:openlabs]
# Um indexador só, como no desenho do lab. Com dois ou mais nesta linha o
# forwarder faz balanceamento automático — e aí entra a fase 5 do handbook,
# porque trocar de destino no meio de um fluxo que ninguém quebrou em eventos
# tem consequência própria.
server = idx:9997
# <handbook:trecho id="o-que-conta-como-entregue">
# <handbook:lacuna>
useACK = true
# </handbook:lacuna>
# </handbook:trecho>
