# O `props.conf` do indexador: a fase de parsing mora aqui — enquanto ninguém
# puser um heavy forwarder no caminho.
#
# O ponto a ler: `LINE_BREAKER`. Ele é o que decide onde um evento começa e
# termina. A documentação de quebra de evento define a semântica em três
# frases: o começo do primeiro grupo de captura é o fim do evento anterior, o
# fim do grupo é o começo do evento seguinte, e o conteúdo do grupo é
# descartado. É por isso que o grupo é `([\r\n]+)` — as quebras de linha somem,
# e a data da linha seguinte, que está fora do grupo, fica no evento.
#
# `SHOULD_LINEMERGE = false` acompanha por obrigação: a mesma documentação diz
# para desligá-lo ao usar `LINE_BREAKER`, e que delimitar evento multilinha
# assim é significativamente mais rápido que remontar linha por linha.
#
# Suba com `--profile heavy` e este arquivo continua aqui, correto, inerte.
#
# Fontes:
#   https://help.splunk.com/en/splunk-enterprise/get-started/get-data-in/9.4/configure-event-processing/configure-event-line-breaking
#   https://help.splunk.com/en/data-management/splunk-enterprise-admin-manual/10.4/administer-splunk-enterprise-with-configuration-files/configuration-parameters-and-the-data-pipeline
[app:json]
SHOULD_LINEMERGE = false
# <handbook:trecho id="onde-um-evento-termina">
# <handbook:lacuna>
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2}T)
# </handbook:lacuna>
# </handbook:trecho>
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3Q%z
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 20000
