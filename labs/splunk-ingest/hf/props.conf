# O MESMO arquivo do indexador, na máquina do meio — e é esse o experimento.
#
# Com o heavy forwarder no caminho, a fase de parsing passa a acontecer aqui,
# porque a regra do Splunk é que cada configuração pertence a um só componente:
# o primeiro da implantação que executa aquela fase. O `idx/props.conf` não foi
# apagado nem editado, e deixou de ter efeito.
#
# Para ver a outra metade do experimento, apague o conteúdo desta estrofe e
# suba de novo: o stack trace volta a entrar como doze eventos, com um
# `LINE_BREAKER` correto instalado no indexador, que não vai executar a fase.
[app:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2}T)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3Q%z
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 20000
