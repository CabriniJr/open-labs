name: CI

# O CI só rodava em `main`, e o trabalho vive em branch: os oitenta e um commits
# desta entrega nunca passaram por ele. Rodar em toda branch é o que faz a
# verificação valer no momento em que ela ainda é barata de consertar.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `astro sync` gera os tipos de `astro:content` e `import.meta.env` que o
      # typecheck consome. Sem isto o tsc quebra em content.config.ts e urls.ts —
      # o build depois roda seu próprio sync, mas o typecheck não.
      - run: pnpm --filter @ovh/site exec astro sync
      - run: pnpm boundaries
      - run: pnpm catalogo
      # O caminho dourado dos handbooks submetidos: o mesmo comando que o autor
      # roda antes de abrir PR. Vem antes do typecheck porque é o mais barato e
      # o que erra mais, e o relato dele é para humano.
      - run: pnpm handbooks
      - run: pnpm codeowners
      - run: pnpm typecheck
      - run: pnpm test
      # The installable SDK must work without workspace links, sources or tsc.
      - run: pnpm sdk:pack
      - run: pnpm sdk:smoke
      - run: pnpm delivery:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: openlabs-sdk-${{ github.sha }}
          path: dist/sdk/
          if-no-files-found: error
      - run: pnpm build
      - run: pnpm --filter @ovh/site exec playwright install --with-deps chromium
      - run: pnpm --filter @ovh/site test:e2e

  visual-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovh/site exec playwright install --with-deps chromium
      - run: pnpm --filter @ovh/site exec playwright test domain-3d.spec.ts spatial-explorer.spec.ts pod-lifecycle.spec.ts hard-context.spec.ts agent-or-gateway.spec.ts palco-legivel.spec.ts docs.spec.ts travessia.spec.ts micro-lab.spec.ts gates-lab.spec.ts links.spec.ts --grep 'domain-3d|spatial-explorer|pod-lifecycle|hard-context|agent-or-gateway|o palco cabe|a landing|splunk-buckets/|dá para descer|o transistor é desenhado|a chave que conduz|nenhum link interno'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-${{ github.sha }}
          path: apps/site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  domain-3d-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [pod-lifecycle, hard-context-and-baggage, agent-or-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovh/site exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm qa:labs --only=labs/${{ matrix.lab }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-3d-${{ matrix.lab }}-${{ github.sha }}
          path: apps/site/qa-report/
          retention-days: 7
