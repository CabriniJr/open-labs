spring.application.name=openlabs-telecentro-api

# O Render informa a porta pela variável PORT; localmente usa 8080.
server.port=${PORT:8080}

# No Render a API fica atrás de um proxy HTTPS: assim o Location e o Swagger usam https:// e o domínio público.
server.forward-headers-strategy=framework

# A conexão com o Oracle não fica aqui: a ConnectionFactory lê DB_URL, DB_USER e DB_PASSWORD do ambiente.
