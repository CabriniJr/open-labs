# O handbook de algoritmos, e o primeiro escrito no contrato em arquivo.
#
# Ele existe porque a pergunta que este motor responde não é sobre hardware: é
# sobre coisas que se movem entre peças — e um algoritmo é isso, visto de perto.
# Uma pilha é uma caixa que guarda, uma fila é uma esteira com política, uma
# ordenação é carga trocando de lugar.
#
# Este arquivo é o caminho dourado: ver `docs/handbooks.md`.
apiVersion: openlabs/handbook/v1

id: algorithms
name: Algorithms Visual Handbook
subject: algorithms
tagline: Logic and algorithms as a course you can run — every claim measured, every cost counted.
blurb: >-
  A stack is a box; a sort is a load changing places; a map is a graph. Five
  sorting algorithms race on one clock, six complexity classes are counted as n
  doubles, and BFS, greedy, Dijkstra and A* cross the same city. Every model here
  runs, and the answer comes out of it — never out of a script.
model: algo.model
stage: building

maintainers:
  - name: Luigi Cabrini
    github: CabriniJr

# Violeta, que é a distância que faz os três handbooks se distinguirem numa aba
# só. As espécies aqui são os itens que trocam de lugar, e a mais discreta é a
# que já está no lugar certo.
theme:
  light:
    accent: "#6d28d9"
    flow: "#6d28d9"
    dropped: "#b8442a"
    ok: "#3f7a52"
    mutation: "#c2410c"
    processor: "#6d28d9"
    conduit: "#3f7a52"
    species: ["#6d28d9", "#0e7490", "#b45309", "#3f7a52"]
  dark:
    accent: "#c4a7f7"
    flow: "#c4a7f7"
    processor: "#c4a7f7"
    species: ["#c4a7f7", "#22d3ee", "#e3b341", "#3fb950"]

# As fases são a grade de uma matéria de lógica e algoritmos: a estrutura que
# guarda, o custo de usá-la, a ordenação como a primeira corrida entre classes,
# o grafo como a estrutura que modela o mundo, os caminhos nele, e as duas
# formas de decidir — a gulosa e a que lembra. Cada lab mede o que afirma.
phases:
  - number: 1
    title: What holds the data
    line: "Stack, queue, table: the boxes everything else is built on."
  - number: 2
    title: One pass at a time
    line: Evaluation and traversal, as items travelling between parts.
  - number: 3
    title: How work grows
    line: "O(1) to O(2ⁿ), counted by real algorithms — and the doubling test that names the class."
  - number: 4
    title: Sorting
    line: The same load, changing places — five algorithms racing on one clock.
  - number: 5
    title: Graphs
    line: Points and the lines between them, and the two ways a program stores them.
  - number: 6
    title: Paths through a graph
    line: BFS, greedy, Dijkstra and A* on the same city map — same loop, different “best”.
  - number: 7
    title: Greedy
    line: Deciding with what is in front of you, and when that is enough.
  - number: 8
    title: Dynamic programming
    line: A table that remembers, so the same work is never done twice.

