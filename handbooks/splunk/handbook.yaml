# O handbook de Splunk, e ele foi submetido pelo caminho dourado — este arquivo
# é a prova de que o caminho serve para um assunto que a casa não conhecia.
#
# Por que Splunk tem lugar num motor de fluxos: o produto inteiro é um
# **pipeline**. A documentação dele não descreve módulos, descreve quatro fases
# por onde o dado passa — input, parsing, indexing, search — e a regra que mais
# custa dinheiro em produção é sobre QUAL COMPONENTE executa cada fase. Isso não
# é um diagrama: é coisa se movendo entre peças, que é exatamente o que este
# motor roda.
#
# O caminho dourado inteiro está em docs/handbooks.md.
apiVersion: openlabs/handbook/v1

id: splunk
name: Splunk Visual Handbook
subject: splunk
tagline: Four phases, and the only question that matters is which machine runs each one.
blurb: >-
  Splunk is a pipeline before it is a search bar. A forwarder that does not
  parse, a parsing phase that happens exactly once, a bucket that ages on disk,
  and a search that is split between two tiers. Every model here runs, and the
  numbers come out of the run.
model: splunk.model
stage: building

# Quem mantém. É daqui que sai o CODEOWNERS deste diretório.
maintainers:
  - name: Luigi Cabrini
    github: CabriniJr

# Terracota, e a escolha é por distância: azul é do OTel, verde-água é do RISC-V
# e violeta é do de algoritmos. O acento foi MEDIDO antes de ser escolhido —
# 6,81:1 sobre o papel claro e 7,46:1 sobre o escuro — porque identidade que
# custa legibilidade não é identidade, é banner.
#
# A espécie mais proeminente é o evento já quebrado (o que o parsing produziu);
# a mais discreta é o bloco cru de 64K, que é o que o forwarder universal
# manda e que ninguém consegue pesquisar.
theme:
  light:
    accent: "#9a3412"
    flow: "#9a3412"
    dropped: "#b8442a"
    ok: "#3f7a52"
    mutation: "#c2410c"
    processor: "#9a3412"
    conduit: "#3f7a52"
    species: ["#9a3412", "#0e7490", "#6d28d9", "#3f7a52"]
  dark:
    accent: "#f0883e"
    flow: "#f0883e"
    processor: "#f0883e"
    species: ["#f0883e", "#22d3ee", "#c4a7f7", "#3fb950"]

# As fases seguem o pipeline da própria documentação, e a ordem é o currículo:
# cada uma só faz sentido depois da anterior, e é por isso que quase todo erro
# de Splunk em produção é um ajuste feito na fase errada.
phases:
  - number: 1
    title: Where the data comes in
    line: "Inputs, forwarders, and what a universal forwarder actually sends."
  - number: 2
    title: Where a byte stream becomes events
    line: Parsing happens once, on the first component that can do it.
  - number: 3
    title: Where it lands
    line: "An index is directories that age: hot, warm, cold, frozen."
  - number: 4
    title: What the search can read
    line: What was decided at index time, and what is still negotiable.
  - number: 5
    title: When one machine is not enough
    line: Load balancing, replication, and the two factors that are not the same promise.
  - number: 6
    title: Who owns the configuration
    line: Deployment apps, layering, and why the same file wins in two different places.

