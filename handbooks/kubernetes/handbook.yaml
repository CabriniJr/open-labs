apiVersion: openlabs/handbook/v1
id: kubernetes
name: Kubernetes Visual Handbook
subject: Kubernetes
tagline: Declare a workload. Watch the system reconcile it.
blurb: >-
  Edit a native manifest and inspect the difference between desired state,
  Pod identity, container restarts and node reservations. Interactive state
  models, with no flow engine required.
model: pod-lifecycle · state model
stage: building
maintainers:
  - name: Luigi Cabrini
    github: CabriniJr
theme:
