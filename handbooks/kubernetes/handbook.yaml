    accent: "#285fce"
    flow: "#285fce"
    dropped: "#b8442a"
    ok: "#3f7a52"
    mutation: "#c2410c"
    processor: "#285fce"
    conduit: "#3f7a52"
    species: ["#285fce", "#0e7490", "#b45309", "#6d28d9"]
  dark:
    accent: "#9bbdff"
    flow: "#9bbdff"
    processor: "#9bbdff"
    species: ["#9bbdff", "#22d3ee", "#e3b341", "#c4a7f7"]
phases:
  - number: 1
    title: A workload becomes real
    line: The manifest, the owner, the Pod and the node are different things.
  - number: 2
    title: Keeping the promise
    line: Updates, availability and the reconciliation decisions still to explore.
